name: circle_scroll_app
description: Circle Screen Scroll Animation with a pseudo-3D particle sphere.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  web: ^1.1.0
  url_launcher: ^6.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ft1.jpeg
    - assets/images/ft2.jpeg
    - assets/images/ft3.jpeg
    - assets/images/ft4.jpeg